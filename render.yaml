
services:
  - type: web
    name: ml-research-claim-auditor-api
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn claim_auditor.api:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/v1/health

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11

      - key: APP_ENV
        value: production

      - key: DEMO_USERNAME
        sync: false

      - key: DEMO_PASSWORD
        sync: false
